name: desk

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "make (one Short now) or plan (the scheduled cycle)"
        default: make
        type: choice
        options: [make, plan]
      url:
        description: "make: the repo, model or article to cover (empty: the editor picks)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: desk
  cancel-in-progress: false

jobs:
  desk:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      AI_GEMINI_API_KEY: ${{ secrets.AI_GEMINI_API_KEY }}
      AI_BUFFER_API_KEY: ${{ secrets.AI_BUFFER_API_KEY }}
      AI_BUFFER_YOUTUBE_ID: ${{ secrets.AI_BUFFER_YOUTUBE_ID }}
      AI_BUFFER_INSTAGRAM_ID: ${{ secrets.AI_BUFFER_INSTAGRAM_ID }}
      AI_BUFFER_FACEBOOK_ID: ${{ secrets.AI_BUFFER_FACEBOOK_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HF_HOME: /home/runner/.cache/huggingface
      PYTHONUNBUFFERED: "1"
      DESK_WORK: /home/runner/work-desk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Plan (post a Short whose slot is due; decide whether to make one)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DESK_COMMAND: ${{ inputs.command }}
        run: |
          pip install -q -r requirements.txt
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DESK_COMMAND" = "make" ]; then
            echo "make=true" >> "$GITHUB_OUTPUT"
          else
            python -m desk.run plan
          fi

      - uses: actions/setup-node@v5
        if: steps.plan.outputs.make == 'true'
        with:
          node-version: "22"

      - name: Caches (Whisper, Playwright, HyperFrames' Chrome, npm)
        if: steps.plan.outputs.make == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/.cache/puppeteer
            ~/.cache/hyperframes
            ~/.npm
          key: studio-v1-${{ hashFiles('requirements-studio.txt') }}
          restore-keys: studio-v1-

      - name: Install the studio
        if: steps.plan.outputs.make == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg espeak-ng > /dev/null
          pip install -q -r requirements-studio.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Make a Short
        if: steps.plan.outputs.make == 'true'
        env:
          DESK_URL: ${{ inputs.url || steps.plan.outputs.url }}
          DESK_BREAKING: ${{ steps.plan.outputs.breaking }}
        run: |
          args=()
          if [ -n "$DESK_URL" ]; then args+=(--url "$DESK_URL"); fi
          if [ "$DESK_BREAKING" = "true" ]; then args+=(--breaking); fi
          python -m desk.run make "${args[@]}"

      - name: Keep the state
        if: always()
        run: |
          git config user.name "ai-shortcut-desk"
          git config user.email "41876720+tarunhndsm@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -q -m "desk: state $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi

      - name: Open an alert issue when a run fails, close it when one succeeds
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          open=$(gh issue list -R "$REPO" --state open --search "Desk alert in:title" --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ] && [ -n "$open" ]; then
            gh issue close "$open" -R "$REPO" -c "Recovered: $RUN_URL"
          elif [ "$OUTCOME" = "failure" ] && [ -z "$open" ]; then
            gh issue create -R "$REPO" -t "Desk alert: a run failed" \
              -b "Run $RUN_URL failed. Later runs keep trying; this issue closes itself when one succeeds."
          fi

      - name: Keep the Short and its review sheet
        if: always() && steps.plan.outputs.make == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desk-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /home/runner/work-desk/*/*.mp4
            /home/runner/work-desk/*/qa/sheet.jpg
            /home/runner/work-desk/*/script.json
            /home/runner/work-desk/*/dossier.json
            /home/runner/work-desk/*/narration.json
            /home/runner/work-desk/*/project/index.html
